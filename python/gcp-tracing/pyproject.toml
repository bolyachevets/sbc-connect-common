[project]
name = "gcp-tracing"
version = "0.1.0"
description = "OpenTelemetry tracing utilities for GCP Cloud Trace integration with Flask applications"
authors = [{name = "BC Registries and Online Services"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3",
    "opentelemetry-sdk>=1.42.0,<2",
    "opentelemetry-exporter-gcp-trace>=1.12.0,<2",
    "opentelemetry-instrumentation-flask>=0.63b1",
    "opentelemetry-instrumentation-requests>=0.63b1",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0,<9",
    "pytest-mock>=3.14.0,<4",
    "pytest-cov>=5.0.0,<6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gcp_tracing"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
